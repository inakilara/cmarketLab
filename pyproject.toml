[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmarketlab"
version = "0.1.0"
description = "Market analysis on perpetual futures data: reusable data, indicator and model code"
requires-python = ">=3.12"
dependencies = ["numpy", "pandas", "pyarrow", "scipy", "statsmodels", "arch", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["cmarketlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
